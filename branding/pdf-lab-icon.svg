<?xml version="1.0" encoding="UTF-8"?>
<!--
  PDF Lab — icon design master (1024 × 1024).

  A light folded document with an amber play symbol on an opaque deep-navy
  background. No lettering, no emoji. The <symbol id="artwork"> block is the
  single source of truth: scripts/render-icons.mjs composes every shipped
  variant from it (rounded "any" icon, full-bleed maskable icon, Apple touch
  icon, favicons). At scale 1 the artwork (±200 × ±280 around the centre,
  corner distance ≈ 344 px) stays inside the maskable safe circle whose radius
  is 40 % of the width (409.6 px).

  This file is a design source; it is NOT copied into public/ or dist/.
  Regenerate the shipped PNG/SVG icons with: npm run icons
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="pdf-lab-bg" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#1e3d78"/>
      <stop offset="0.62" stop-color="#112653"/>
      <stop offset="1" stop-color="#0a1633"/>
    </radialGradient>
    <linearGradient id="pdf-lab-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eef6"/>
    </linearGradient>
    <linearGradient id="pdf-lab-play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="pdf-lab-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020817" flood-opacity="0.45"/>
    </filter>
    <filter id="pdf-lab-play-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#92400e" flood-opacity="0.35"/>
    </filter>
    <symbol id="artwork" overflow="visible">
      <!-- Folded document: top-right corner turned over -->
      <g filter="url(#pdf-lab-shadow)">
        <path d="M -170 -280 L 80 -280 L 200 -160 L 200 250 Q 200 280 170 280 L -170 280 Q -200 280 -200 250 L -200 -250 Q -200 -280 -170 -280 Z" fill="url(#pdf-lab-page)"/>
      </g>
      <!-- Fold flap with a soft crease -->
      <path d="M 80 -280 L 80 -190 Q 80 -160 110 -160 L 200 -160 Z" fill="#cbd5e1"/>
      <path d="M 80 -280 L 80 -190 Q 80 -160 110 -160 L 200 -160" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linejoin="round" opacity="0.6"/>
      <!-- Amber play symbol (rounded corners via round joins) -->
      <g filter="url(#pdf-lab-play-shadow)">
        <path d="M -58 -102 L 98 -14 L -58 74 Z" fill="url(#pdf-lab-play)" stroke="url(#pdf-lab-play)" stroke-width="34" stroke-linejoin="round"/>
      </g>
      <!-- Abstract text lines (not lettering) -->
      <rect x="-124" y="136" width="248" height="26" rx="13" fill="#cbd5e1"/>
      <rect x="-124" y="192" width="164" height="26" rx="13" fill="#cbd5e1"/>
    </symbol>
  </defs>
  <!-- Default composition: the rounded-square "any" icon -->
  <rect width="1024" height="1024" rx="224" fill="url(#pdf-lab-bg)"/>
  <use href="#artwork" transform="translate(512 512) scale(1.12)"/>
</svg>
